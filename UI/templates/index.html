<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GenAI Multi-Tool Assistant Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/chat.css') }}">

</head>

<body>
    <div class="container">
        <div class="chat-card">
            <h3 class="text-center mb-4"><i class="fas fa-robot mode-icon"></i>GenAI Chat Dashboard</h3>

            <div class="select-mode">
                <label for="modeSelect" class="form-label">Select Tool</label>
                <select class="form-select form-select-sm" id="modeSelect" onchange="toggleMode()">
                    <option value="RAG">📄 RAG</option>
                    <option value="Text-SQL">💬 Text-SQL</option>
                    <option value="Image-Upload">🖼️ Image-Upload</option>
                    <option value="Generate Report">📊 Generate Report</option>
                </select>
            </div>

            <!-- RAG Mode -->
            <div id="ragMode" class="chat-box">
                <form id="ragForm">
                    <div class="mb-3">
                        <input type="text" name="question" id="ragQuestion" class="form-control" placeholder="Ask a question about uploaded PDFs...">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit</button>
                     <div id="ragProgress" class="progress mt-3 d-none">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
                    </div>
                </form>
                <div id="ragResponse" class="mt-3"></div>
            </div>

            <!-- Image Upload Mode -->
            <div id="imageUploadMode" class="chat-box hidden">
                <form id="imageForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" name="file" id="imageFile" class="form-control">
                    </div>
                    <div class="mb-3">
                        <input type="text" name="question" id="imageQuestion" class="form-control" placeholder="Ask something about the image...">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit</button>
                     <div id="imageProgress" class="progress mt-3 d-none">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
                    </div>
                </form>
                <div id="imageResponse" class="mt-3"></div>
            </div>
            <!-- text to sql Mode -->
            <div id="textSqlMode" class="chat-box hidden text-muted">
                <form id="txtsqlForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="text" name="question" id="txtsqlquestion" class="form-control" placeholder="Ask something about the database...">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit</button>
                    <div id="txtsqlProgress" class="progress mt-3 d-none">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
                    </div>
                </form>
                <div id="txtsqlResponse" class="mt-3"></div>
            </div>

            <div id="reportMode" class="chat-box hidden text-muted">
                <form id="reportForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="text" name="question" id="reportquestion" class="form-control" placeholder="Ask something about the report...">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit</button>
                    <div id="reportProgress" class="progress mt-3 d-none">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
                    </div>
                </form>
                <div id="reportResponse" class="mt-3"></div>
            </div>
        </div>
    </div>

 <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
